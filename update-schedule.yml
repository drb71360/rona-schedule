name: Update RONA Schedule iCal Feed

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  update-ical:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Fetch schedule and generate iCal
        env:
          LEGION_EMAIL:    ${{ secrets.LEGION_EMAIL }}
          LEGION_PASSWORD: ${{ secrets.LEGION_PASSWORD }}
          LEGION_ORG:      ${{ secrets.LEGION_ORG }}
          LEGION_WEEKS_AHEAD:  "8"
          LEGION_WEEKS_BEHIND: "2"
          ICAL_OUTPUT: "schedule.ics"
          LOG_LEVEL: "INFO"
        run: python scraper.py

      # ── Upload debug screenshots as an artifact (always runs, even on failure) ──
      # After the workflow runs, go to: Actions → this run → Artifacts → debug-screenshots
      # Download the zip to see exactly what the browser saw during login.
      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug/
          if-no-files-found: warn
          retention-days: 7

      - name: Deploy to GitHub Pages
        # Only deploy if the scraper actually succeeded
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          include_files: |
            schedule.ics
            index.html
          commit_message: "chore: update schedule.ics [skip ci]"
          force_orphan: false
          enable_jekyll: false
